<div>
  <!-- Trigger button -->
  <button
    #triggerButton
    type="button"
    (click)="toggleOpen()"
    class="size-8 inline-flex items-center justify-center rounded-lg
           text-[var(--c-400)] hover:text-[var(--c-800)] hover:bg-[var(--c-100)] hover:shadow-sm
           border border-transparent hover:border-[var(--c-200)]
           transition-all duration-200 group/trigger">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
         class="size-4 group-hover/trigger:scale-110 transition-transform">
      <circle cx="12" cy="5" r="1.5"/>
      <circle cx="12" cy="12" r="1.5"/>
      <circle cx="12" cy="19" r="1.5"/>
    </svg>
  </button>

  <!-- Dropdown menu (CDK Overlay Portal) -->
  <ng-template #dropdownMenu>
    <div class="w-[180px] bg-[var(--c-50)] border border-[var(--c-200)]
                rounded-[10px] shadow-lg overflow-hidden animate-fade-in">
      
      <!-- Edit option -->
      <button
        type="button"
        (click)="selectAction('edit')"
        class="w-full px-4 py-3 text-left text-[0.875rem] text-[var(--c-800)]
               hover:bg-[var(--c-100)] transition-colors border-b border-[var(--c-200)]
               flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" 
             stroke="currentColor" class="size-4 text-[var(--c-600)]">
          <path stroke-linecap="round" stroke-linejoin="round" 
                d="m16.862 4.487l1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>
        <span>Editar</span>
      </button>

      <!-- Archive option -->
      <button
        type="button"
        (click)="selectAction('archive')"
        class="w-full px-4 py-3 text-left text-[0.875rem] text-[var(--c-800)]
               hover:bg-[var(--c-100)] transition-colors border-b border-[var(--c-200)]
               flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" 
             stroke="currentColor" class="size-4 text-[var(--c-600)]">
          <path stroke-linecap="round" stroke-linejoin="round" 
                d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H2.25C1.629 3.75 1.125 4.254 1.125 4.875V6.375c0 .621.504 1.125 1.125 1.125Z" />
        </svg>
        <span>Archivar</span>
      </button>

      <!-- Delete option -->
      <button
        type="button"
        (click)="selectAction('delete')"
        class="w-full px-4 py-3 text-left text-[0.875rem] text-[#c0392b]
               hover:bg-[rgba(192,57,43,0.08)] transition-colors
               flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" 
             stroke="currentColor" class="size-4 text-[#c0392b]">
          <path stroke-linecap="round" stroke-linejoin="round" 
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 2.991a48.694 48.694 0 0 0-3.432-.036m3.432.036a48.874 48.874 0 0 0-5.007.145m-4.872.03a.478.478 0 0 0-.477.477m.585.244h7.338A.478.478 0 0 0 15 4.477m-5.6 0a.478.478 0 0 0-.477.477m1.582 5.08c0 .39-.03.765-.09 1.125m5.08 0c-.06-.36-.09-.735-.09-1.125m0 0a7.5 7.5 0 1 1-15 0m12 0a7.5 7.5 0 1 0-15 0" />
        </svg>
        <span>Eliminar</span>
      </button>
    </div>
  </ng-template>
</div>
