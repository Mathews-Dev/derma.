<div class="relative w-full max-w-xs">
  <!-- Label -->
  @if (label()) {
    <label class="block text-[0.7rem] font-medium tracking-[0.12em] uppercase text-[var(--c-400)] mb-2">
      {{ label() }}
    </label>
  }

  <!-- Input field -->
  <button
    type="button"
    (click)="toggleOpen()"
    [disabled]="disabled()"
    class="w-full px-3 py-2 text-left text-[0.825rem] font-light text-[var(--c-800)] placeholder-[var(--c-400)]
           border-b border-[var(--c-200)] bg-transparent transition-colors duration-300 outline-none
           hover:border-[var(--c-300)] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-between"
    [class.border-[var(--c-800)]]="isOpen()">
    <span class="block text-[var(--c-800)]">
      {{ selectedDateValue() || 'Seleccionar fecha' }}
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-[var(--c-400)] flex-shrink-0 ml-2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" />
    </svg>
  </button>

  <!-- Calendar popup -->
  @if (isOpen()) {
    <div class="absolute top-full left-0 mt-2 z-50 bg-[var(--c-50)] border border-[var(--c-200)] rounded-[8px] p-4 shadow-md">
      
      <!-- Month/Year header with navigation -->
      <div class="flex items-center justify-between mb-4">
        <!-- Previous month button -->
        <button
          type="button"
          (click)="previousMonth()"
          class="p-1 hover:bg-[var(--c-100)] rounded-[4px] transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-[var(--c-600)]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>

        <!-- Month and year display -->
        <h3 class="text-[0.825rem] font-medium text-[var(--c-800)]">
          {{ monthYear() }}
        </h3>

        <!-- Next month button -->
        <button
          type="button"
          (click)="nextMonth()"
          class="p-1 hover:bg-[var(--c-100)] rounded-[4px] transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-[var(--c-600)]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5L15.75 12l-7.5 7.5" />
          </svg>
        </button>
      </div>

      <!-- Days of week header -->
      <div class="grid grid-cols-7 gap-1 mb-2">
        @for (day of ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sab', 'Dom']; track $index) {
          <div class="w-8 h-6 flex items-center justify-center text-[0.7rem] font-medium text-[var(--c-400)]">
            {{ day }}
          </div>
        }
      </div>

      <!-- Calendar grid -->
      <div class="grid grid-cols-7 gap-1">
        @for (day of calendarDays(); track $index) {
          @if (day === null) {
            <div class="w-8 h-8"></div>
          } @else {
            <button
              type="button"
              (click)="selectDay(day)"
              [disabled]="disabled()"
              [class]="'w-8 h-8 flex items-center justify-center rounded-[4px] text-[0.825rem] transition-all duration-300 disabled:cursor-not-allowed ' +
                       (isSelected(day) 
                         ? 'bg-[var(--c-800)] text-[var(--c-50)] hover:bg-[var(--c-700)]' 
                         : 'text-[var(--c-800)] hover:bg-[var(--c-100)]')">
              {{ day }}
            </button>
          }
        }
      </div>
    </div>
  }
</div>
