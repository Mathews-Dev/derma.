<span
  #trigger
  class="inline-flex"
  (mouseenter)="show()"
  (mouseleave)="hide()"
  (focusin)="show()"
  (focusout)="hide()">
  <ng-content></ng-content>
</span>

<ng-template #tooltipPanel>
  <div
    class="pointer-events-none relative rounded-md bg-[var(--c-800)] px-2.5 py-1.5 text-[10px] text-[var(--c-50)] whitespace-nowrap transition-all"
    [class.animate-tooltip-in]="!isClosing()"
    [class.animate-tooltip-out]="isClosing()"
    style="box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);"
    role="tooltip"
    [attr.data-open]="isOpen()">
    {{ text() }}
    <!-- Arrow para placement="top" por defecto, aunque Overlay maneja la posición -->
    <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-[var(--c-800)] rotate-45"></div>
  </div>
</ng-template>
