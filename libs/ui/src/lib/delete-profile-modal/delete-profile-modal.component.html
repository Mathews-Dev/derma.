@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-8
              bg-[var(--c-100)]/70 backdrop-blur-sm">
    <div class="relative w-full max-w-[420px] bg-[var(--c-50)] rounded-[20px] overflow-hidden border border-[var(--c-200)]"
         style="padding: 2.25rem 2rem 1.75rem;">
      
      <!-- Geometría decorativa — NO ELIMINAR, NO MOVER -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <div class="geo-arc-1"></div>
        <div class="geo-arc-2"></div>
        <div class="geo-diagonal"></div>
      </div>

      <!-- Botón cerrar — esquina superior derecha, pequeño, sin texto -->
      <!-- hover: fondo var(--c-800), ícono se vuelve var(--c-50) -->
      <button
        (click)="onCancel()"
        class="close"
        aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Ícono warning — caja con borde, NO fondo de color -->
      <div class="modal-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
      </div>

      <!-- Título — SIEMPRE dos líneas con <br>, primera en font-light, segunda en font-semibold -->
      <h2>
        ¿Eliminar<br>
        <strong>{{ profileName || 'este perfil' }}?</strong>
      </h2>

      <!-- Descripción -->
      <p>Esta acción es permanente. Todos los datos asociados al usuario serán eliminados y no podrán recuperarse.</p>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Botones — alineados a la DERECHA, nunca centrados, nunca full-width -->
      <div class="footer">
        <button class="btn-cancel" (click)="onCancel()">Cancelar</button>
        <button class="btn-confirm" (click)="onConfirm()">Eliminar</button>
      </div>
    </div>
  </div>
}
