<div>
  <!-- Trigger button -->
  <button 
    #triggerButton
    type="button"
    (click)="$event.stopPropagation(); toggleOpen()"
    class="w-full h-[44px] px-3 bg-[var(--c-50)] outline-none border border-[var(--c-200)] hover:border-[var(--c-400)] focus:bg-[var(--c-50)] focus:border-[var(--c-800)] focus:ring-1 focus:ring-[var(--c-800)] transition-all duration-200 ease-out rounded-xl
           text-left text-[12px] leading-snug text-[var(--c-800)] placeholder:text-[var(--c-400)]
           flex items-center justify-between gap-2">
    <span class="block min-w-0 flex-1 truncate font-normal">
      {{ selectedOption()?.label || placeholder() }}
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" 
         stroke="currentColor" class="size-4 text-[var(--c-500)] transition-transform shrink-0"
         [class.rotate-180]="isOpen()">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </button>

  <!-- Dropdown panel (CDK Overlay Portal) -->
  <ng-template #dropdownPanel>
    <div class="bg-[var(--c-50)] border border-[var(--c-200)] 
                rounded-[10px] shadow-lg overflow-hidden min-w-[160px] w-full">
      <!-- Options list -->
      <ul class="max-h-[350px] overflow-y-auto py-2">
        @if (options().length > 0) {
          @for (option of options(); track option.id) {
            <li>
              <button
                type="button"
                (click)="select(option)"
                class="w-full px-4 py-[10px] text-left text-[12px] leading-snug text-[var(--c-800)]
                       hover:bg-[var(--c-100)] transition-colors
                       border-b border-[var(--c-200)] last:border-b-0
                       flex items-center justify-between gap-2
                       [&.active]:bg-[var(--c-100)] [&.active]:font-semibold font-normal"
                [class.active]="selectedValue() === option.id">
                {{ option.label }}
                @if (selectedValue() === option.id) {
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
                       stroke-width="1.5" stroke="currentColor" class="size-4 text-[var(--c-800)]">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                  </svg>
                }
              </button>
            </li>
          }
        } @else {
          <li class="px-4 py-6 text-center text-[var(--c-400)] text-[12px] leading-snug">
            Sin opciones
          </li>
        }
      </ul>
    </div>
  </ng-template>
</div>
