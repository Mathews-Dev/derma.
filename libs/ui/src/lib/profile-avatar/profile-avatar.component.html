<div class="relative w-20 h-20 shrink-0">

  <!-- Círculo / avatar clickeable -->
  <div
    class="relative w-full h-full bg-[var(--c-50)] flex items-center justify-center
           cursor-pointer overflow-hidden group/av shadow-sm
           transition-all duration-300 hover:border-[var(--c-400)] border border-[var(--c-200)]"
    [class.rounded-full]="shape() === 'circle'"
    [class.rounded-2xl]="shape() === 'rounded'"
    (click)="triggerUpload()">

    <!-- Foto -->
    @if (photoUrl()) {
      <img
        [src]="photoUrl()"
        alt="Foto de perfil"
        class="absolute inset-0 w-full h-full object-cover
               transition-transform duration-500 group-hover/av:scale-105" />
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round"
           class="text-[var(--c-300)]">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    }

    <!-- Overlay hover con ícono de cámara -->
    <div class="absolute inset-0 bg-[var(--c-800)]/70 backdrop-blur-[2px]
                flex items-center justify-center
                opacity-0 group-hover/av:opacity-100 transition-all duration-300">
      <svg class="size-5 text-[var(--c-50)]" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
      </svg>
    </div>

    <!-- Spinner de carga -->
    @if (isUploading()) {
      <div class="absolute inset-0 bg-white/70 backdrop-blur-[2px]
                  flex items-center justify-center">
        <svg class="animate-spin size-4 text-[var(--c-800)]" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
        </svg>
      </div>
    }

    <!-- Input de archivo oculto -->
    <input
      #fileInput
      type="file"
      (change)="onFileChange($event)"
      accept="image/*"
      class="hidden" />
  </div>

  <!-- Badge quitar foto -->
  @if (photoUrl() && canRemove()) {
    <ui-tooltip text="Quitar foto" class="absolute -top-1.5 -right-1.5 z-10">
      <button
        type="button"
        (click)="onRemove($event)"
        class="group/btn bg-[var(--c-50)] border border-[var(--c-200)] rounded-full p-1
               shadow-sm transition-colors hover:border-red-300 focus:outline-none
               flex items-center justify-center">
        <svg class="size-3 text-[var(--c-500)] group-hover/btn:text-red-500 transition-colors"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </ui-tooltip>
  }

</div>
