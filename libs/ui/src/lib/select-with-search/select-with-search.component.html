<div>
  <!-- Trigger button -->
  <button 
    #triggerButton
    type="button"
    (click)="$event.stopPropagation(); toggleOpen()"
    class="w-full px-4 py-2 bg-[var(--c-50)] border border-[var(--c-200)] rounded-[10px] 
           text-left text-[var(--c-800)] hover:border-[var(--c-300)] transition-colors
           flex items-center justify-between">
    <span class="text-[0.93rem]">
      {{ selectedOption()?.label || placeholder() }}
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" 
         stroke="currentColor" class="size-4 text-[var(--c-500)] transition-transform"
         [class.rotate-180]="isOpen()">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </button>

  <!-- Dropdown panel (CDK Overlay Portal) -->
  <ng-template #dropdownPanel>
    <div class="bg-[var(--c-50)] border border-[var(--c-200)] 
                rounded-[10px] shadow-lg overflow-hidden">
      <!-- Search input -->
      <div class="p-3 border-b border-[var(--c-200)]">
        <input 
          type="text"
          [value]="searchTerm()"
          (input)="onSearchChange($event.target.value)"
          [placeholder]="placeholder()"
          class="w-full px-3 py-2 bg-[var(--c-100)] border border-[var(--c-200)] rounded-[6px]
                 text-[0.875rem] text-[var(--c-800)] outline-none
                 focus:border-[var(--c-300)] transition-colors" />
      </div>

      <!-- Options list -->
      <ul class="max-h-[300px] overflow-y-auto">
        @if (filteredOptions().length > 0) {
          @for (option of filteredOptions(); track option.id) {
            <li>
              <button
                type="button"
                (click)="select(option)"
                class="w-full px-4 py-3 text-left text-[0.875rem] text-[var(--c-800)]
                       hover:bg-[var(--c-100)] transition-colors
                       border-b border-[var(--c-200)] last:border-b-0
                       flex items-center justify-between
                       [&.active]:bg-[var(--c-100)] [&.active]:font-medium"
                [class.active]="selectedValue() === option.id">
                {{ option.label }}
                @if (selectedValue() === option.id) {
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
                       stroke-width="1.5" stroke="currentColor" class="size-4 text-[var(--c-800)]">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                  </svg>
                }
              </button>
            </li>
          }
        } @else {
          <li class="px-4 py-6 text-center text-[var(--c-400)] text-[0.875rem]">
            Sin resultados
          </li>
        }
      </ul>
    </div>
  </ng-template>
</div>
