<div class="scheduler-layout relative bg-[var(--c-50)] rounded-xl border border-[var(--c-200)] overflow-hidden animate-smooth-enter"
     [class.sidebar-collapsed]="sidebarCollapsed()"
     [class.right-panel-collapsed]="rightPanelCollapsed()">

  <!-- Sidebar Toggle -->
  <button class="panel-toggle toggle-sidebar"
          (click)="toggleSidebar()"
          [title]="sidebarCollapsed() ? 'Mostrar lateral' : 'Contraer lateral'">
    <i [class]="sidebarCollapsed() ? 'chevron-right' : 'chevron-left'"></i>
  </button>

  <ui-agenda-sidebar
    class="agenda-sidebar-comp"
    [profesionales]="profesionalesSidebar() ?? []"
    [selectedDate]="selectedDate()"
    [datesWithTurns]="datesWithTurns()"
    (dateSelect)="onDateSelect($event)"
    (monthChange)="onSidebarMonthChange($event)"
    (filterChange)="onFilterChange($event)"
    (searchChange)="onSearchChange($event)"
    (newTurn)="onNewTurn()">
  </ui-agenda-sidebar>

  <ui-calendar-grid
    [selectedDate]="selectedDate()"
    [viewMode]="viewMode()"
    [turns]="filteredTurns()"
    (selectedDateChange)="selectedDate.set($event)"
    (viewModeChange)="onViewChange($event)"
    (turnoClick)="onTurnoClick($event)"
    (turnoMoved)="onTurnoMoved($event)">
  </ui-calendar-grid>

  <ui-agenda-list
    class="agenda-list-comp"
    [turns]="dayTurns()"
    (turnoClick)="onTurnoClick($event)"
    (quickAction)="onQuickAction($event)">
  </ui-agenda-list>

  <!-- Right Panel Toggle -->
  <button class="panel-toggle toggle-right-panel"
          (click)="toggleRightPanel()"
          [title]="rightPanelCollapsed() ? 'Mostrar resumen' : 'Contraer resumen'">
    <i [class]="rightPanelCollapsed() ? 'chevron-left' : 'chevron-right'"></i>
  </button>
</div>

<!-- ── Modales ── -->

@if (modalDetalle() && turnoSeleccionado()) {
  <derm-turno-detalle-modal
    [turno]="turnoSeleccionado()!"
    (accion)="onDetalleAccion($event)"
    (close)="onDetalleClose()">
  </derm-turno-detalle-modal>
}

@if (modalCancelar() && turnoSeleccionado()) {
  <derm-turno-cancelar-modal
    [turno]="turnoSeleccionado()!"
    [guardando]="cancelando()"
    (confirm)="onCancelarConfirm($event)"
    (close)="onCancelarClose()">
  </derm-turno-cancelar-modal>
}

@if (modalReprogramar() && turnoSeleccionado(); as turnoRep) {
  @if (profesionalDelTurno(turnoRep); as profRep) {
    <derm-turno-reprogramar-modal
      [turno]="turnoRep"
      [profesional]="profRep"
      [turnosOcupados]="allTurns() ?? []"
      [fechaSeleccionada]="selectedDate()"
      [guardando]="reprogramando()"
      (confirm)="onReprogramarConfirm($event)"
      (close)="onReprogramarClose()">
    </derm-turno-reprogramar-modal>
  }
}

@if (modalPago() && turnoSeleccionado()) {
  <derm-turno-pago-modal
    [turno]="turnoSeleccionado()!"
    [mpPhase]="pagoMpPhase()"
    [mpCheckout]="pagoMpCheckout()"
    [mpError]="pagoMpError()"
    [metodoPagoExito]="pagoMetodoExito()"
    [whatsappExitoOk]="pagoWaExitoOk()"
    (confirm)="onPagoConfirm($event)"
    (listo)="onPagoListo()"
    (close)="onPagoClose()">
  </derm-turno-pago-modal>
}

@if (modalNuevo()) {
  <derm-turno-nuevo-modal
    [profesionales]="profesionales() ?? []"
    [fechaSeleccionada]="selectedDate()"
    [turnosOcupados]="allTurns() ?? []"
    (turnoConfirmado)="onNuevoTurnoConfirmado($event)"
    (close)="onNuevoClose()">
  </derm-turno-nuevo-modal>
}
