<div class="modal-backdrop" (click)="$event.target === $event.currentTarget && close.emit()">
  <div class="modal-box animate-scale-in">
    <div class="modal-header">
      <span class="modal-icon modal-icon--primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
      </span>
      <div>
        <h2 class="modal-title">Reprogramar turno</h2>
        <p class="modal-subtitle">{{ turno().pacienteNombre }}</p>
      </div>
      <button class="modal-close" (click)="close.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <label class="field-label">Nueva fecha</label>
      <input class="field-input"
             type="date"
             [ngModel]="nuevaFechaStr()"
             (ngModelChange)="nuevaFechaStr.set($event)" />

      <div class="time-row">
        <div class="time-field">
          <label class="field-label">Hora inicio</label>
          <input class="field-input"
                 type="time"
                 [ngModel]="horaInicio()"
                 (ngModelChange)="horaInicio.set($event)" />
        </div>
        <div class="time-field">
          <label class="field-label">Hora fin</label>
          <input class="field-input"
                 type="time"
                 [ngModel]="horaFin()"
                 (ngModelChange)="horaFin.set($event)" />
        </div>
      </div>

      <label class="field-label">Motivo de reprogramación <span class="required">*</span></label>
      <textarea class="field-textarea"
                placeholder="Ej: El paciente solicitó cambio de fecha…"
                [ngModel]="motivo()"
                (ngModelChange)="motivo.set($event)"
                rows="3"
                maxlength="300">
      </textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn--ghost" (click)="close.emit()">Cancelar</button>
      <button class="btn btn--primary" [disabled]="!canConfirm" (click)="onConfirm()">Reprogramar</button>
    </div>
  </div>
</div>
