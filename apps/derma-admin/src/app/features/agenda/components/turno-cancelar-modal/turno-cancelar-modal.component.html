<div class="modal-backdrop" (click)="$event.target === $event.currentTarget && close.emit()">
  <div class="modal-box animate-scale-in">
    <div class="modal-header">
      <span class="modal-icon modal-icon--danger">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </span>
      <div>
        <h2 class="modal-title">Cancelar turno</h2>
        <p class="modal-subtitle">{{ turno().pacienteNombre }} · {{ turno().horaInicio }} – {{ turno().horaFin }}</p>
      </div>
      <button class="modal-close" (click)="close.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label class="field-label">Motivo de cancelación <span class="required">*</span></label>
      <textarea
        class="field-textarea"
        placeholder="Ej: El paciente solicitó cancelar por motivos personales…"
        [ngModel]="motivo()"
        (ngModelChange)="motivo.set($event)"
        rows="3"
        maxlength="300">
      </textarea>
      <span class="field-hint">Mínimo 5 caracteres</span>

      <label class="checkbox-row">
        <input type="checkbox"
               [ngModel]="conReembolso()"
               (ngModelChange)="conReembolso.set($event)" />
        <span>Marcar pago como <strong>Reembolsado</strong></span>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn--ghost" (click)="close.emit()">Volver</button>
      <button class="btn btn--danger" [disabled]="!canConfirm" (click)="onConfirm()">Cancelar turno</button>
    </div>
  </div>
</div>
