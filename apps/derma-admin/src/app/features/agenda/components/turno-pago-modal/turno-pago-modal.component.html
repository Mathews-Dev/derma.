<div class="modal-backdrop" (click)="$event.target === $event.currentTarget && close.emit()">
  <div class="modal-box animate-scale-in">
    <div class="modal-header">
      <span class="modal-icon modal-icon--success">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
      </span>
      <div>
        <h2 class="modal-title">Registrar pago</h2>
        <p class="modal-subtitle">{{ turno().pacienteNombre }} · {{ fmtMonto(turno().monto) }}</p>
      </div>
      <button class="modal-close" (click)="close.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Selector de método -->
      <div class="method-tabs">
        <button class="method-tab" [class.active]="tipoPago() === 'efectivo'" (click)="setTipo('efectivo')">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
          Efectivo
        </button>
        <button class="method-tab" [class.active]="tipoPago() === 'mercado_pago'" (click)="setTipo('mercado_pago')">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
          Mercado Pago
        </button>
      </div>

      <!-- Monto -->
      <label class="field-label">Monto a cobrar</label>
      <div class="monto-input-wrap">
        <span class="monto-prefix">$</span>
        <input class="field-input monto-input"
               type="number"
               min="0"
               step="100"
               [ngModel]="monto()"
               (ngModelChange)="monto.set(+$event)" />
      </div>

      <!-- Info de MP -->
      @if (tipoPago() === 'mercado_pago') {
        <div class="mp-notice">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span>Se iniciará el proceso de pago vía Mercado Pago. El estado se actualizará automáticamente cuando el pago sea confirmado.</span>
        </div>
      }
    </div>

    <div class="modal-footer">
      <button class="btn btn--ghost" (click)="close.emit()">Cancelar</button>
      <button class="btn btn--primary" [disabled]="!canConfirm" (click)="onConfirm()">
        {{ tipoPago() === 'efectivo' ? 'Registrar efectivo' : 'Iniciar pago MP' }}
      </button>
    </div>
  </div>
</div>
