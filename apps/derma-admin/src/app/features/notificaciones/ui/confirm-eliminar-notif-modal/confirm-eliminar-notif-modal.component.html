<div
  class="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-backdrop"
  [class.animate-backdrop-in]="!isClosing()"
  [class.animate-backdrop-out]="isClosing()"
  (click)="triggerCancel()"
>
  <div
    class="relative w-full max-w-[400px] bg-[var(--c-50)] rounded-[20px] overflow-hidden border border-[var(--c-200)] shadow-xl"
    style="padding: 2.25rem 2rem 1.75rem;"
    [class.animate-modal-in]="!isClosing()"
    [class.animate-modal-out]="isClosing()"
    (click)="$event.stopPropagation()"
  >
    <div class="geo" aria-hidden="true">
      <div class="geo-arc-1"></div>
      <div class="geo-arc-2"></div>
      <div class="geo-diagonal"></div>
    </div>

    <button (click)="triggerCancel()" class="close" aria-label="Cerrar">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="modal-icon" [class.stagger-1]="!isClosing()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
      </svg>
    </div>

    <h2 [class.stagger-2]="!isClosing()">
      Eliminar<br>
      <strong>notificaciones</strong>
    </h2>

    <p [class.stagger-3]="!isClosing()">
      Se borrarán todas tus notificaciones de forma permanente. Esta acción no se puede deshacer.
    </p>

    <div class="divider" [class.stagger-4]="!isClosing()"></div>

    <div class="flex flex-col gap-2 relative z-10" [class.stagger-5]="!isClosing()">
      <button type="button" (click)="triggerConfirm()" class="btn-primary">
        Eliminar todo
      </button>
      <button type="button" (click)="triggerCancel()" class="btn-cancel">
        Cancelar
      </button>
    </div>
  </div>
</div>
