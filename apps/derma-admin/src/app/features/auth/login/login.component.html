<div class="min-h-screen flex items-center justify-center p-4 bg-[var(--c-50)] selection:bg-[var(--c-200)] selection:text-[var(--c-800)]">

  <div class="w-full max-w-[980px] bg-[var(--c-50)] rounded-[32px] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] flex overflow-hidden animate-in">

    <div class="hidden md:flex w-[38%] bg-[var(--c-50)] relative items-center justify-center overflow-hidden border-r border-[var(--c-200)]">
      

      <!-- Logo / Contenido Centrado -->
      <div class="relative z-10 flex flex-col items-center gap-7 p-8 text-center">
        
        <!-- D Invertida (Logo Variante 13) -->
        <div class="animate-in-logo w-24 h-24 flex items-center justify-center bg-[var(--c-800)] border-[3px] border-[var(--c-800)] rounded-2xl shadow-[4px_4px_0px_var(--c-300)] overflow-hidden shrink-0 hover:-translate-y-1 transition-transform duration-300">
          <span class="font-goodly text-[var(--c-50)] text-[3.5rem] leading-[1] tracking-[-3px]">
            d.
          </span>
        </div>
        
        <!-- Texto decorativo -->
        <div class="space-y-4">
          <h1 class="animate-in-title text-[var(--c-800)] text-2xl font-light tracking-[0.2em] font-goodly">derma.</h1>
          <div class="h-[1px] w-12 mx-auto bg-[var(--c-300)]"></div>
          <p class="animate-in-subtitle text-[var(--c-500)] text-[0.65rem] uppercase tracking-[0.2em] font-medium">Centro Médico Especializado</p>
        </div>
      </div>
    </div>

   
    <div class="w-full md:w-[62%] bg-[var(--c-50)] p-8 sm:p-10 flex flex-col justify-center relative">

      <div class="w-full max-w-[400px] mx-auto">
        
        <!-- Header del Formulario -->
        <div class="mb-8">
          <h2 class="text-3xl font-light text-[var(--c-800)] tracking-tight">
            Iniciar Sesión
          </h2>
          <p class="text-[0.8rem] text-[var(--c-500)] font-light mt-2 tracking-wide">
            Ingresa tus credenciales para acceder a tu perfil.
          </p>
        </div>

        @if (error()) {
          <div class="mb-6 p-3 bg-[var(--c-100)] border-l-2 border-[var(--c-800)] text-[0.75rem] text-[var(--c-800)] font-medium tracking-wide">
            {{ error() }}
          </div>
        }

        <!-- FORMULARIO -->
        <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="space-y-4">

          <!-- Correo Electrónico -->
          <div class="animate-in-input">
            <ui-input
              label="Correo Electrónico"
              type="email"
              [control]="formulario.controls.email"
            />
          </div>

          <!-- Contraseña -->
          <div class="animate-in-input">
            <ui-input
              label="Contraseña"
              type="password"
              [control]="formulario.controls.password"
            />
          </div>

          <!-- Footer & Buttons -->
          <div class="mt-3 pt-5 border-t border-[var(--c-200)] flex gap-3">
            <div class="flex-1"></div>
            <!-- Botón Primario -->
            <ui-button
              type="submit"
              label="Ingresar"
              size="h-[44px] py-2"
              buttonClass="w-auto"
              [disabled]="formulario.invalid">
            </ui-button>

            <!-- Botón Google -->
            <button (click)="loginWithGoogle()" type="button" class="group flex items-center justify-center gap-1.5 h-[44px] px-8 w-auto rounded-lg border border-[var(--c-200)] bg-[var(--c-50)] hover:bg-[var(--c-100)] hover:border-[var(--c-300)] transition-all duration-200 active:scale-[0.98]">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              <span class="hidden sm:inline text-[0.65rem] text-[var(--c-600)] font-medium tracking-wide uppercase group-hover:text-[var(--c-800)]">
                Continuar con Google
              </span>
            </button>
          </div>
        </form>

        <div class="mt-8 text-center">
          <a href="#" class="text-xs text-[var(--c-500)] hover:text-[var(--c-700)] transition-colors">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
