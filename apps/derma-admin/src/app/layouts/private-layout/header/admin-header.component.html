<header class="fixed top-0 inset-x-0 z-40 h-16 flex items-center justify-between bg-[var(--c-50)]/95 backdrop-blur border-b border-[var(--c-200)] px-4 lg:px-8 shadow-sm">
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="lg:hidden h-10 w-10 flex items-center justify-center rounded-md border border-[var(--c-200)] text-[var(--c-700)] hover:bg-[var(--c-100)]"
      (click)="onToggleSidebar()"
      aria-label="Abrir menú"
    >
      <span class="sr-only">Abrir menú</span>
      <div class="h-4 w-4 border-t border-b border-[var(--c-700)]"></div>
    </button>
    <div class="flex flex-col leading-tight">
      <span class="text-sm uppercase tracking-[0.22em] text-[var(--c-400)]">Derma</span>
      <span class="text-lg font-semibold text-[var(--c-800)]">Backoffice</span>
    </div>
  </div>

  <div class="flex items-center gap-4">
    @if (user()) {
      <div class="flex flex-col items-end">
        <span class="text-sm font-semibold text-[var(--c-800)]">{{ user()!.nombre }} {{ user()!.apellido }}</span>
        <span class="text-[0.75rem] uppercase tracking-[0.16em] text-[var(--c-400)]">{{ user()!.rol }}</span>
      </div>
      <button
        type="button"
        class="h-10 px-3 rounded-md border border-[var(--c-200)] text-[var(--c-600)] hover:border-[var(--c-300)]"
        (click)="onLogout()"
      >
        Cerrar sesión
      </button>
    } @else {
      <span class="text-sm text-[var(--c-500)]">Sin sesión</span>
    }
  </div>
</header>
